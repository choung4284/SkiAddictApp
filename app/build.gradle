plugins { id 'com.android.application' }
android {
    namespace 'fun.skiaddict.projector'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.skiaddict.projector'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6-thai-projector-presets'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
